<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="250">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070212" />
      <stop offset="50%" stop-color="#120428" />
      <stop offset="100%" stop-color="#090117" />
    </linearGradient>

    <!-- Neon Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1493" />
      <stop offset="35%" stop-color="#00FFFF" />
      <stop offset="70%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1493" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00FFFF" stop-opacity="0.25" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feGaussianBlur stdDeviation="24" result="blur3" />
      <feMerge>
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes neonPulse {
        0%, 100% {
          filter: drop-shadow(0 0 10px #FF1493) drop-shadow(0 0 25px #9400D3) drop-shadow(0 0 45px #00FFFF);
          opacity: 0.95;
        }
        50% {
          filter: drop-shadow(0 0 22px #00FFFF) drop-shadow(0 0 42px #FF1493) drop-shadow(0 0 70px #9400D3);
          opacity: 1;
        }
      }

      @keyframes waveBar {
        0%, 100% { transform: scaleY(0.25); }
        50% { transform: scaleY(1); }
      }

      @keyframes starTwinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.3); }
      }

      @keyframes borderGlow {
        0%, 100% { stroke: #FF1493; }
        50% { stroke: #00FFFF; }
      }

      .main-title {
        font-family: 'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 52px;
        font-weight: 900;
        letter-spacing: 7px;
        text-anchor: middle;
        fill: url(#textGrad);
        animation: neonPulse 2.8s ease-in-out infinite;
      }

      .subtitle {
        font-family: 'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 5px;
        text-anchor: middle;
        fill: #E2E8F0;
        opacity: 0.9;
        filter: drop-shadow(0 0 8px #00FFFF);
      }

      .badge-text {
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-anchor: middle;
        fill: #FFFFFF;
      }

      .animated-border {
        animation: borderGlow 4s linear infinite;
      }

      .bar {
        transform-origin: bottom;
        animation: waveBar 1.2s ease-in-out infinite alternate;
      }
      .b1 { animation-delay: 0.1s; animation-duration: 0.9s; }
      .b2 { animation-delay: 0.3s; animation-duration: 1.3s; }
      .b3 { animation-delay: 0.5s; animation-duration: 0.8s; }
      .b4 { animation-delay: 0.2s; animation-duration: 1.1s; }
      .b5 { animation-delay: 0.4s; animation-duration: 1.4s; }
      .b6 { animation-delay: 0.6s; animation-duration: 1.0s; }
      .b7 { animation-delay: 0.15s; animation-duration: 1.2s; }
      .b8 { animation-delay: 0.35s; animation-duration: 0.85s; }

      .star {
        animation: starTwinkle 2.5s ease-in-out infinite alternate;
      }
      .s1 { animation-delay: 0.2s; }
      .s2 { animation-delay: 0.8s; }
      .s3 { animation-delay: 1.4s; }
      .s4 { animation-delay: 0.5s; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="5" y="5" width="840" height="240" rx="20" fill="url(#bgGrad)" stroke="#FF1493" stroke-width="2" stroke-opacity="0.8" class="animated-border" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="80" r="100" fill="#FF1493" opacity="0.12" filter="url(#neonGlow)" />
  <circle cx="700" cy="170" r="120" fill="#00FFFF" opacity="0.12" filter="url(#neonGlow)" />
  <circle cx="425" cy="125" r="90" fill="#9400D3" opacity="0.15" filter="url(#neonGlow)" />

  <!-- Background Music Equalizer Waves (Left) -->
  <g transform="translate(45, 175)" opacity="0.75" fill="#FF1493">
    <rect class="bar b1" x="0" y="-50" width="4" height="50" rx="2" />
    <rect class="bar b2" x="8" y="-50" width="4" height="50" rx="2" fill="#FF007F" />
    <rect class="bar b3" x="16" y="-50" width="4" height="50" rx="2" fill="#00FFFF" />
    <rect class="bar b4" x="24" y="-50" width="4" height="50" rx="2" fill="#9400D3" />
    <rect class="bar b5" x="32" y="-50" width="4" height="50" rx="2" fill="#FF1493" />
    <rect class="bar b6" x="40" y="-50" width="4" height="50" rx="2" fill="#00FFFF" />
    <rect class="bar b7" x="48" y="-50" width="4" height="50" rx="2" fill="#FF007F" />
    <rect class="bar b8" x="56" y="-50" width="4" height="50" rx="2" fill="#00E5FF" />
  </g>

  <!-- Background Music Equalizer Waves (Right) -->
  <g transform="translate(745, 175)" opacity="0.75" fill="#00FFFF">
    <rect class="bar b8" x="0" y="-50" width="4" height="50" rx="2" fill="#00E5FF" />
    <rect class="bar b7" x="8" y="-50" width="4" height="50" rx="2" fill="#FF007F" />
    <rect class="bar b6" x="16" y="-50" width="4" height="50" rx="2" fill="#00FFFF" />
    <rect class="bar b5" x="24" y="-50" width="4" height="50" rx="2" fill="#FF1493" />
    <rect class="bar b4" x="32" y="-50" width="4" height="50" rx="2" fill="#9400D3" />
    <rect class="bar b3" x="40" y="-50" width="4" height="50" rx="2" fill="#00FFFF" />
    <rect class="bar b2" x="48" y="-50" width="4" height="50" rx="2" fill="#FF007F" />
    <rect class="bar b1" x="56" y="-50" width="4" height="50" rx="2" fill="#FF1493" />
  </g>

  <!-- Twinkling Stars -->
  <g class="star s1" transform="translate(180, 50)" fill="#00FFFF">
    <polygon points="0,-6 2,-2 6,0 2,2 0,6 -2,2 -6,0 -2,-2" />
  </g>
  <g class="star s2" transform="translate(680, 60)" fill="#FF1493">
    <polygon points="0,-8 3,-3 8,0 3,3 0,8 -3,3 -8,0 -3,-3" />
  </g>
  <g class="star s3" transform="translate(240, 180)" fill="#FF007F">
    <polygon points="0,-5 2,-2 5,0 2,2 0,5 -2,2 -5,0 -2,-2" />
  </g>
  <g class="star s4" transform="translate(620, 185)" fill="#00FFFF">
    <polygon points="0,-6 2,-2 6,0 2,2 0,6 -2,2 -6,0 -2,-2" />
  </g>

  <!-- Glowing Musical Notes -->
  <text x="120" y="70" font-size="24" fill="#FF1493" opacity="0.6" filter="url(#softGlow)">♬</text>
  <text x="720" y="80" font-size="28" fill="#00FFFF" opacity="0.6" filter="url(#softGlow)">♪</text>

  <!-- Main Title -->
  <text x="425" y="105" class="main-title">✦ AADHYA MUSIC ✦</text>

  <!-- Subtitle -->
  <text x="425" y="145" class="subtitle">ULTRA FAST &amp; LOW-RESOURCE TELEGRAM MUSIC BOT</text>

  <!-- Feature Badges -->
  <g transform="translate(145, 180)">
    <!-- Badge 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="130" height="28" rx="14" fill="url(#badgeGrad)" stroke="#FF1493" stroke-width="1.2" />
      <text x="65" y="18" class="badge-text">⚡ FAST API</text>
    </g>

    <!-- Badge 2 -->
    <g transform="translate(140, 0)">
      <rect x="0" y="0" width="130" height="28" rx="14" fill="url(#badgeGrad)" stroke="#00FFFF" stroke-width="1.2" />
      <text x="65" y="18" class="badge-text">☁️ RENDER READY</text>
    </g>

    <!-- Badge 3 -->
    <g transform="translate(280, 0)">
      <rect x="0" y="0" width="130" height="28" rx="14" fill="url(#badgeGrad)" stroke="#9400D3" stroke-width="1.2" />
      <text x="65" y="18" class="badge-text">🚀 PYTGCALLS V2</text>
    </g>

    <!-- Badge 4 -->
    <g transform="translate(420, 0)">
      <rect x="0" y="0" width="140" height="28" rx="14" fill="url(#badgeGrad)" stroke="#FF007F" stroke-width="1.2" />
      <text x="70" y="18" class="badge-text">🎧 24x7 STREAM</text>
    </g>
  </g>
</svg>