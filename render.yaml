services:
  - type: web
    name: aadhya-music-bot
    runtime: python
    plan: free
    buildCommand: "pip install -U pip && pip install -r requirements.txt"
    startCommand: "python3 -m VishalMusic"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.13"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: STRING_SESSION
        sync: false
      - key: MONGO_DB_URI
        sync: false
      - key: OWNER_ID
        sync: false
      - key: LOGGER_ID
        sync: false
      - key: YOUTUBE_API_1
        value: "https://api.alonexraj.shop"
      - key: YOUTUBE_API_KEY_1
        sync: false
